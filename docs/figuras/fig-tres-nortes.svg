<rect x="20" y="290" width="185" height="66" fill="#f7f7f7" stroke="#bbb" rx="4"/>
<text x="30" y="310" font-family="sans-serif" font-size="11" fill="#e31a1c">Declinação ≈ 21°–22° W</text>
<text x="30" y="326" font-family="sans-serif" font-size="9" fill="#666">confirmar no ano (modelo IGRF/</text>
<text x="30" y="338" font-family="sans-serif" font-size="9" fill="#666">WMM); muda todo ano</text>
<text x="30" y="352" font-family="sans-serif" font-size="9" fill="#666">Fitz (2000): δ e variação anual</text>
<rect x="355" y="290" width="185" height="66" fill="#f7f7f7" stroke="#bbb" rx="4"/>
<text x="365" y="310" font-family="sans-serif" font-size="11" fill="#1f78b4">Convergência ≈ 0°41'</text>
<text x="365" y="326" font-family="serif" font-size="11" font-style="italic" fill="#666">c ≈ Δλ · sen φ</text>
<text x="365" y="340" font-family="sans-serif" font-size="9" fill="#666">Δλ = 46°44' − 45°W ; φ ≈ 23°34'S</text>
<text x="280" y="384" font-family="sans-serif" font-size="10" fill="#999" text-anchor="middle">ângulos exagerados para leitura — na carta, desenhe em escala angular</text>
