<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400" role="img" aria-label="Paralaxe estereoscópica">
<rect width="620" height="400" fill="#ffffff"/>
<text x="310" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Paralaxe — medir a altura no par estéreo</text>
<circle cx="180" cy="80" r="5" fill="#e31a1c"/><text x="150" y="72" font-family="sans-serif" font-size="11" fill="#e31a1c">exposição 1</text>
<circle cx="440" cy="80" r="5" fill="#e31a1c"/><text x="412" y="72" font-family="sans-serif" font-size="11" fill="#e31a1c">exposição 2</text>
<line x1="180" y1="80" x2="440" y2="80" stroke="#e31a1c" stroke-dasharray="4 3"/>
<text x="310" y="72" font-family="serif" font-size="12" font-style="italic" fill="#e31a1c" text-anchor="middle">B (aerobase)</text>
<rect x="60" y="330" width="500" height="30" fill="#efe6d9" stroke="#8a7a5c"/>
<rect x="295" y="250" width="30" height="80" fill="#c8b89a" stroke="#6b5c40"/>
<text x="336" y="258" font-family="sans-serif" font-size="11" fill="#6b5c40">topo (A)</text>
<text x="336" y="344" font-family="sans-serif" font-size="11" fill="#6b5c40">base (B)</text>
<line x1="180" y1="80" x2="310" y2="250" stroke="#33a02c" stroke-width="1.3"/>
<line x1="440" y1="80" x2="310" y2="250" stroke="#33a02c" stroke-width="1.3"/>
<line x1="180" y1="80" x2="310" y2="330" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="440" y1="80" x2="310" y2="330" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/>
<line x1="580" y1="80" x2="580" y2="330" stroke="#333"/>
<line x1="575" y1="80" x2="585" y2="80" stroke="#333"/><line x1="575" y1="330" x2="585" y2="330" stroke="#333"/>
<text x="590" y="210" font-family="serif" font-size="13" font-style="italic" fill="#333">H</text>
<line x1="270" y1="250" x2="270" y2="330" stroke="#33a02c"/>
<line x1="265" y1="250" x2="275" y2="250" stroke="#33a02c"/><line x1="265" y1="330" x2="275" y2="330" stroke="#33a02c"/>
<text x="248" y="295" font-family="serif" font-size="13" font-style="italic" fill="#33a02c">Δh</text>
<rect x="60" y="150" width="200" height="80" fill="#f7f7f7" stroke="#bbb" rx="4"/>
<text x="70" y="172" font-family="sans-serif" font-size="11" fill="#222">Diferença de paralaxe:</text>
<text x="70" y="193" font-family="serif" font-size="13" font-style="italic" fill="#333">Δp = p(topo) − p(base)</text>
<text x="70" y="217" font-family="serif" font-size="15" font-style="italic" fill="#1f78b4">Δh = H·Δp / (b + Δp)</text>
<text x="310" y="384" font-family="sans-serif" font-size="10" fill="#999" text-anchor="middle">O topo desloca-se mais que a base entre as fotos: esse excedente é Δp. Fonte: Fitz (2000).</text>
</svg>
