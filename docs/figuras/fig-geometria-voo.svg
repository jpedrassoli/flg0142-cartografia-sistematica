<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" role="img" aria-label="Geometria da foto aérea: escala e GSD">
<rect width="620" height="380" fill="#ffffff"/>
<text x="310" y="26" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">Geometria da foto aérea vertical</text>
<rect x="60" y="300" width="500" height="40" fill="#efe6d9" stroke="#8a7a5c"/>
<text x="310" y="325" font-family="sans-serif" font-size="12" fill="#5c5140" text-anchor="middle">terreno</text>
<rect x="235" y="95" width="150" height="12" fill="#cfe3f2" stroke="#1f78b4"/>
<text x="310" y="90" font-family="sans-serif" font-size="11" fill="#1f78b4" text-anchor="middle">plano da foto (filme/sensor)</text>
<circle cx="310" cy="130" r="5" fill="#e31a1c"/>
<text x="322" y="128" font-family="sans-serif" font-size="11" fill="#e31a1c">centro de projeção (lente)</text>
<path d="M310 130 L100 300" stroke="#e31a1c" stroke-width="1.4" fill="none"/>
<path d="M310 130 L520 300" stroke="#e31a1c" stroke-width="1.4" fill="none"/>
<line x1="290" y1="107" x2="290" y2="130" stroke="#333"/>
<line x1="285" y1="107" x2="295" y2="107" stroke="#333"/><line x1="285" y1="130" x2="295" y2="130" stroke="#333"/>
<text x="272" y="123" font-family="serif" font-size="13" font-style="italic" fill="#333">f</text>
<line x1="580" y1="130" x2="580" y2="300" stroke="#333"/>
<line x1="575" y1="130" x2="585" y2="130" stroke="#333"/><line x1="575" y1="300" x2="585" y2="300" stroke="#333"/>
<text x="590" y="220" font-family="serif" font-size="13" font-style="italic" fill="#333">H</text>
<line x1="310" y1="130" x2="310" y2="300" stroke="#999" stroke-dasharray="4 3"/>
<rect x="60" y="150" width="150" height="72" fill="#f7f7f7" stroke="#bbb" rx="4"/>
<text x="70" y="172" font-family="sans-serif" font-size="12" fill="#222">Escala da foto:</text>
<text x="70" y="192" font-family="serif" font-size="15" font-style="italic" fill="#1f78b4">E = f / H</text>
<text x="70" y="213" font-family="sans-serif" font-size="10" fill="#666">(mesma unidade)</text>
<rect x="410" y="150" width="150" height="72" fill="#f7f7f7" stroke="#bbb" rx="4"/>
<text x="420" y="172" font-family="sans-serif" font-size="12" fill="#222">Pixel no terreno:</text>
<text x="420" y="192" font-family="serif" font-size="15" font-style="italic" fill="#1f78b4">GSD = H·p / f</text>
<text x="420" y="213" font-family="sans-serif" font-size="10" fill="#666">p = tamanho do pixel</text>
<text x="310" y="366" font-family="sans-serif" font-size="10" fill="#999" text-anchor="middle">Fonte: adaptado de Fitz (2000), Cartografia Básica</text>
</svg>
